name: NCA Android CI - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project zip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "NCA_Electrical_Android*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Extracted project ZIP."

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"
          echo "Using SDK: $SDK_ROOT"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          ls -lh "$APK_FILE"

      - name: Create SHA256
        shell: bash
        run: |
          sha256sum "$APK_FILE" > app-debug.apk.sha256
          cp "$APK_FILE" app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NCA-Electrical-Suite-v2.2-debug
          path: |
            app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
